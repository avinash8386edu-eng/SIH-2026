version: '3.8'

services:
  polaris-db:
    image: mysql:8.0
    container_name: polaris_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: Avinash786@#$
      MYSQL_DATABASE: polaris_db
    ports:
      - "3306:3306"
    volumes:
      - polaris_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  polaris-backend:
    build: 
      context: ./polaris-backend
      dockerfile: Dockerfile
    container_name: polaris_backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # Override the application.properties to point to the docker MySQL container instead of localhost
      - SPRING_DATASOURCE_URL=jdbc:mysql://polaris-db:3306/polaris_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=Avinash786@#$
      # Externalize JWT secret for production best practices
      - JWT_SECRET=5367566B59703373367639792F423F4528482B4D6251655468576D5A71347437
    depends_on:
      polaris-db:
        condition: service_healthy

volumes:
  polaris_db_data:
