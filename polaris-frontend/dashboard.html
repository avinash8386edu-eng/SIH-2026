<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POLARIS - Dashboard</title>
    <link rel="stylesheet" href="css/main.css">
<link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0D1B2A">
</head>
<body>

    <div class="app-container">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="logo">POLARIS</div>
            <a href="dashboard.html" class="active">Dashboard</a>
            <a href="cargo.html">Cargo & Assets</a>
            <a href="inventory.html">Inventory</a>
            <a href="personnel.html">Personnel Tracker</a>
            <a href="emergency.html">Emergency / SOS</a>
            <a href="#" onclick="logout()" style="margin-top: auto; border-top: 1px solid #ffffff22;">Logout</a>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <h2>Command Center Dashboard</h2>
            
            <div class="stats-grid">
                <div class="card stat-card">
                    <h4>Total Personnel</h4>
                    <h3 id="stat-personnel">0</h3>
                </div>
                <div class="card stat-card">
                    <h4>Active Cargo Assets</h4>
                    <h3 id="stat-cargo">0</h3>
                </div>
                <div class="card stat-card">
                    <h4>Low Stock Alerts</h4>
                    <h3 id="stat-inventory" style="color: #F39C12;">0</h3>
                </div>
                <div class="card stat-card">
                    <h4>Active Emergencies</h4>
                    <h3 id="stat-emergency" style="color: #E74C3C;">0</h3>
                </div>
            </div>
            
            <div class="card">
                <h3>System Status</h3>
                <p>Welcome to POLARIS Command Center. All systems operational.</p>
            </div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script>
        async function loadDashboard() {
            try {
                // Fetch stats concurrently
                const [personnel, assets, inventory, emergencies] = await Promise.all([
                    apiCall('/personnel'),
                    apiCall('/assets'),
                    apiCall('/inventory'),
                    apiCall('/emergency')
                ]);

                document.getElementById('stat-personnel').innerText = personnel.length || 0;
                
                // Count active assets (not packed or returned)
                const activeAssets = (assets || []).filter(a => a.status !== 'PACKED' && a.status !== 'RETURNED').length;
                document.getElementById('stat-cargo').innerText = activeAssets;

                // Count low stock
                const lowStockCount = (inventory || []).filter(i => i.quantity <= i.minimumThreshold).length;
                document.getElementById('stat-inventory').innerText = lowStockCount;

                // Count active emergencies
                const activeEmergencyCount = (emergencies || []).filter(e => e.status === 'ACTIVE').length;
                document.getElementById('stat-emergency').innerText = activeEmergencyCount;
                
            } catch (err) {
                console.error("Failed to load dashboard stats", err);
            }
        }
        
        loadDashboard();
        setInterval(loadDashboard, 10000); // Auto-sync every 10 seconds
    </script>
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
    <script>
        // Connect to WebSocket for instant SOS alerts
        if (typeof SockJS !== 'undefined' && typeof Stomp !== 'undefined') {
            const socket = new SockJS('http://localhost:8080/ws-emergency');
            const stompClient = Stomp.over(socket);
            stompClient.debug = null; 
            stompClient.connect({}, (frame) => {
                stompClient.subscribe('/topic/sos', (message) => {
                    const data = JSON.parse(message.body);
                    const alertBox = document.createElement('div');
                    alertBox.style = "position:fixed; top:20px; right:20px; background:#E74C3C; color:white; padding:20px; border-radius:8px; z-index:9999; border: 2px solid #fff;";
                    alertBox.innerHTML = `<h3>🚨 CRITICAL SOS ALARM!</h3><p>Type: ${data.type}</p><p>Location: ${data.latitude || 'N/A'}, ${data.longitude || 'N/A'}</p>`;
                    document.body.appendChild(alertBox);
                    
                    // Force refresh stats
                    loadDashboard();
                    
                    setTimeout(() => { if(document.body.contains(alertBox)) document.body.removeChild(alertBox); }, 15000);
                });
            });
        }
    </script>
</body>
</html>
