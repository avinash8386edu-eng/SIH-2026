<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POLARIS - Inventory</title>
    <link rel="stylesheet" href="css/main.css">
    <style>
        .expiring-soon { background-color: rgba(231, 76, 60, 0.2); }
    </style>
<link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0D1B2A">
</head>
<body>

    <div class="app-container">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="logo">POLARIS</div>
            <a href="dashboard.html">Dashboard</a>
            <a href="cargo.html">Cargo & Assets</a>
            <a href="inventory.html" class="active">Inventory</a>
            <a href="personnel.html">Personnel Tracker</a>
            <a href="fuel.html">Fuel & AI Monitoring</a>`n            <a href="emergency.html">Emergency / SOS</a>
            <a href="#" onclick="logout()" style="margin-top: auto;">Logout</a>
        </div>

        <div class="main-content">
            <h2>Inventory Management</h2>
            
            <div class="card">
                <button class="btn btn-primary" onclick="toggleForm()">+ Add New Item</button>
                <button class="btn btn-primary" style="margin-left: 10px;" onclick="loadExpiring()">View Expiring Soon</button>
                <button class="btn btn-primary" style="margin-left: 10px;" onclick="loadInventory()">View All</button>
            </div>

            <!-- Form -->
            <div id="addForm" class="card" style="display: none;">
                <h3>Add Inventory Item</h3>
                <form id="inventoryForm">
                    <div class="form-group">
                        <label>Item Name</label>
                        <input type="text" id="itemName" required>
                    </div>
                    <div class="form-group">
                        <label>Category</label>
                        <select id="category">
                            <option value="FOOD">Food</option>
                            <option value="FUEL">Fuel</option>
                            <option value="MEDICAL">Medical</option>
                            <option value="SCIENTIFIC">Scientific</option>
                            <option value="SPARE">Spare Parts</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Quantity</label>
                        <input type="number" id="quantity" step="0.01" required>
                    </div>
                    <div class="form-group">
                        <label>Unit (kg, Liters, boxes)</label>
                        <input type="text" id="unit" required>
                    </div>
                    <div class="form-group">
                        <label>Minimum Threshold</label>
                        <input type="number" id="minThreshold" step="0.01" required>
                    </div>
                    <div class="form-group">
                        <label>Expiry Date</label>
                        <input type="date" id="expiryDate">
                    </div>
                    <div class="form-group">
                        <label>Storage Location</label>
                        <input type="text" id="storageLocation" required>
                    </div>
                    <button type="submit" class="btn btn-primary">Save Item</button>
                </form>
            </div>

            <div class="card">
                <h3>Stock List</h3>
                <table>
                    <thead>
                        <tr>
                            <th>Item Name</th>
                            <th>Category</th>
                            <th>Quantity</th>
                            <th>Threshold</th>
                            <th>Expiry Date</th>
                            <th>Location</th>
                        </tr>
                    </thead>
                    <tbody id="invTableBody">
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script>
        function toggleForm() {
            const form = document.getElementById('addForm');
            form.style.display = form.style.display === 'none' ? 'block' : 'none';
        }

        document.getElementById('inventoryForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const data = {
                itemName: document.getElementById('itemName').value,
                category: document.getElementById('category').value,
                quantity: parseFloat(document.getElementById('quantity').value),
                unit: document.getElementById('unit').value,
                minimumThreshold: parseFloat(document.getElementById('minThreshold').value),
                expiryDate: document.getElementById('expiryDate').value || null,
                storageLocation: document.getElementById('storageLocation').value
            };
            
            try {
                await apiCall('/inventory', 'POST', data);
                toggleForm();
                document.getElementById('inventoryForm').reset();
                loadInventory();
            } catch (e) {
                alert('Failed to save item');
            }
        });

        function renderTable(items) {
            const tbody = document.getElementById('invTableBody');
            tbody.innerHTML = '';
            
            const today = new Date();
            const thirtyDays = new Date();
            thirtyDays.setDate(today.getDate() + 30);

            items.forEach(i => {
                let rowClass = '';
                
                // Highlight expiring
                if(i.expiryDate) {
                    const expDate = new Date(i.expiryDate);
                    if(expDate <= thirtyDays) {
                        rowClass = 'expiring-soon';
                    }
                }
                
                // Highlight low stock
                let qtyStyle = '';
                if(i.quantity <= i.minimumThreshold) {
                    qtyStyle = 'color: #E74C3C; font-weight: bold;';
                }

                tbody.innerHTML += `
                    <tr class="${rowClass}">
                        <td>${i.itemName}</td>
                        <td>${i.category}</td>
                        <td style="${qtyStyle}">${i.quantity} ${i.unit}</td>
                        <td>${i.minimumThreshold} ${i.unit}</td>
                        <td>${i.expiryDate || 'N/A'}</td>
                        <td>${i.storageLocation}</td>
                    </tr>
                `;
            });
        }

        async function loadInventory() {
            try {
                const items = await apiCall('/inventory');
                renderTable(items);
            } catch(e) {}
        }
        
        async function loadExpiring() {
            try {
                const items = await apiCall('/inventory/expiring');
                renderTable(items);
            } catch(e) {}
        }

        loadInventory();
    </script>
</body>
</html>
