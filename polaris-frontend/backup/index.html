<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POLARIS - Expedition Command System</title>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/main.css">
</head>
<body>
    <!-- Background Particles/Aurora -->
    <canvas id="bg-canvas"></canvas>

    <!-- Sidebar: The Command Navigator -->
    <nav id="sidebar">
        <div class="brand neon-text">
            <i class="fa-solid fa-satellite-dish"></i> POLARIS
        </div>
        
        <ul class="nav-menu">
            <div class="nav-group">
                <div class="nav-group-title">Command</div>
                <li><a href="#overview" class="nav-item active"><i class="fa-solid fa-chart-line"></i> Overview</a></li>
            </div>
            
            <div class="nav-group">
                <div class="nav-group-title">Expeditions</div>
                <li><a href="#planner" class="nav-item"><i class="fa-solid fa-map-location-dot"></i> Planner</a></li>
            </div>

            <div class="nav-group">
                <div class="nav-group-title">Cargo</div>
                <li><a href="#cargo-manifest" class="nav-item"><i class="fa-solid fa-box-open"></i> Manifest</a></li>
                <li><a href="#cargo-scan" class="nav-item"><i class="fa-solid fa-qrcode"></i> QR Scanner</a></li>
            </div>

            <div class="nav-group">
                <div class="nav-group-title">Intelligence</div>
                <li><a href="#intelligence" class="nav-item"><i class="fa-solid fa-brain"></i> Risk Center</a></li>
            </div>

            <div class="nav-group">
                <div class="nav-group-title">Emergency</div>
                <li><a href="#emergency" class="nav-item neon-text-red"><i class="fa-solid fa-triangle-exclamation"></i> SAR / SOS</a></li>
            </div>
        </ul>
    </nav>

    <!-- Top Telemetry Bar -->
    <header id="topbar">
        <div class="telemetry-widget">
            <div class="telemetry-item">
                <i class="fa-solid fa-temperature-empty"></i>
                <span id="telemetry-maitri">MAITRI: <strong>-14°C</strong> | WIND: <strong>18kts</strong></span>
            </div>
            <div class="telemetry-item" style="margin-left: 20px;">
                <i class="fa-solid fa-temperature-quarter"></i>
                <span id="telemetry-bharati">BHARATI: <strong>-19°C</strong> | WIND: <strong>34kts</strong></span>
            </div>
        </div>
        
        <div class="telemetry-widget">
            <div class="telemetry-item" id="network-badge">
                <span class="pulse-dot"></span>
                <strong class="neon-text" style="color: #00FF66;">VSAT SECURE</strong>
            </div>
            <div class="telemetry-item" style="margin-left: 20px; font-size: 1.2rem; cursor: pointer;">
                <i class="fa-solid fa-user-astronaut"></i>
            </div>
        </div>
    </header>

    <!-- Main Dynamic Content Area (SPA Router renders here) -->
    <main id="dynamic-content">
        <!-- Injected via app.js -->
    </main>

    <!-- Javascript Libraries -->
    <script src="https://unpkg.com/dexie@3.2.4/dist/dexie.js"></script>
    <script src="js/polar-bg.js"></script>
    <script type="module" src="js/app.js"></script>
</body>
</html>
