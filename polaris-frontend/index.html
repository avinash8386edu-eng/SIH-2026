<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POLARIS - Login</title>
    <link rel="stylesheet" href="css/main.css">
<link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0D1B2A">
</head>
<body>

    <div class="login-container">
        <h1 style="font-size: 48px; letter-spacing: 5px; color: #85C1E9;">POLARIS</h1>
        <p>Indian Antarctic Expedition Management</p>
        
        <div class="card">
            <div style="text-align: center; margin-bottom: 20px;">
                <h3 style="color: #2ECC71;">DEMO MODE: QUICK LOGIN</h3>
                <p style="color: #BDC3C7; font-size: 14px;">Select a role to instantly log in without passwords.</p>
            </div>
            
            <button onclick="login('commander@polaris.com', 'commander123')" class="btn btn-primary" style="width: 100%; margin-bottom: 15px; font-size: 16px; padding: 15px;">
                👮 Log in as <strong>Commander</strong> (Full Access)
            </button>
            
            <button onclick="login('admin@polaris.com', 'admin123')" class="btn btn-warning" style="width: 100%; margin-bottom: 15px; font-size: 16px; padding: 15px; color: #fff;">
                📦 Log in as <strong>Logistics Officer</strong> (Cargo)
            </button>

            <button onclick="login('scientist1@polaris.com', 'sci123')" class="btn btn-danger" style="width: 100%; margin-bottom: 15px; font-size: 16px; padding: 15px;">
                🔬 Log in as <strong>Field Scientist</strong> (Field Ops)
            </button>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script>
        // Register Service Worker
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js').then(reg => {
                console.log('Service Worker registered', reg);
            }).catch(err => console.error('SW Error', err));
        }
    </script>
</body>
